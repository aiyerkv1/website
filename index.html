<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krishnanaiyer.com</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><style>rect { fill: %23333333; } text { fill: %23fcfcfc; } @media (prefers-color-scheme: dark) { rect { fill: %23fcfcfc; } text { fill: %231a1a1a; } }</style><rect width=%22100%22 height=%22100%22 rx=%2220%22/><text x=%2250%22 y=%2275%22 font-size=%2270%22 font-family=%22'Helvetica Neue', Helvetica, Arial, sans-serif%22 font-weight=%22300%22 text-anchor=%22middle%22>k</text></svg>">
    <style>
        /* --- CSS Variables for Easy Theme Switching --- */
        :root {
            --bg-color: #fcfcfc;
            --text-color: #333;
            --btn-bg: #e0e0e0;
            --btn-text: #333;
        }

        /* Dark Mode Overrides */
        .dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #fcfcfc;
            --btn-bg: #333;
            --btn-text: #fcfcfc;
        }

        /* --- General Page Styling --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; 
            width: 100%; 
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        /* --- Top Controls Container (Stacks buttons vertically) --- */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between the buttons */
        }

        /* --- Button & Icon Styling --- */
        .control-btn {
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50%; /* Perfect circle */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease, opacity 0.3s ease;
            padding: 0;
            text-decoration: none; /* Removes underline from the link */
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        /* Sizing the SVG inside the link */
        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor; /* Automatically matches the text-color variable */
        }

        /* --- Container for the Text Block --- */
        .typing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .line-wrapper {
            width: max-content;
        }

        /* --- Base Styling for Both Lines --- */
        .line {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            padding-bottom: 5px;
            
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid transparent; 
            width: 0; 
        }

        /* --- Line 1 Specifics --- */
        .line1 {
            animation: 
                typing 1.5s steps(18, end) forwards,
                blink-cursor 0.7s step-end 5 forwards;
        }

        /* --- Line 2 Specifics --- */
        .line2 {
            animation: 
                typing 1.5s steps(20, end) 3.5s forwards,
                blink-cursor 0.7s step-end 3.5s infinite;
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .line {
                font-size: 1.5rem;
                border-right-width: 2px;
            }
        }

        /* --- Animation Keyframes --- */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-cursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: var(--text-color); }
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <button id="darkModeToggle" class="control-btn" aria-label="Toggle Dark Mode">🌙</button>
        
        <a href="https://www.linkedin.com/in/krishnanaiyer/" target="_blank" rel="noopener noreferrer" class="control-btn" aria-label="LinkedIn Profile">
            <svg viewBox="0 0 24 24">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
        </a>
    </div>

    <div class="typing-container">
        <div class="line-wrapper">
            <p class="line line1">hi. i am krishnan.</p>
        </div>
        <div class="line-wrapper">
            <p class="line line2">thanks for visiting.</p>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('darkModeToggle');
        const body = document.body;

        // 1. Check if the user already chose dark mode in a previous visit
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggleBtn.textContent = '☀️';
        }

        // 2. Listen for clicks on the button
        toggleBtn.addEventListener('click', () => {
            // Toggle the class on the body
            body.classList.toggle('dark-mode');

            // 3. Update the button text and save the preference
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = '🌙';
            }
        });
    </script>

</body>
</html>
