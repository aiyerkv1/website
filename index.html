<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krishnanaiyer.com</title>
    <style>
        /* --- CSS Variables for Easy Theme Switching --- */
        :root {
            --bg-color: #fcfcfc;
            --text-color: #333;
            --btn-bg: #e0e0e0;
            --btn-text: #333;
        }

        /* Dark Mode Overrides */
        .dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #fcfcfc;
            --btn-bg: #333;
            --btn-text: #fcfcfc;
        }

        /* --- General Page Styling --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; 
            width: 100%; 
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        /* --- Dark Mode Toggle Button (Icon Only) --- */
        #darkModeToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50%; /* Makes the button a perfect circle */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 0;
        }

        #darkModeToggle:hover {
            opacity: 0.8;
        }

        /* --- Container for the Text Block --- */
        .typing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .line-wrapper {
            width: max-content;
        }

        /* --- Base Styling for Both Lines --- */
        .line {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            padding-bottom: 5px;
            
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid transparent; 
            width: 0; 
        }

        /* --- Line 1 Specifics --- */
        .line1 {
            animation: 
                typing 1.5s steps(18, end) forwards,
                blink-cursor 0.7s step-end 5 forwards;
        }

        /* --- Line 2 Specifics --- */
        .line2 {
            animation: 
                typing 1.5s steps(20, end) 3.5s forwards,
                blink-cursor 0.7s step-end 3.5s infinite;
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .line {
                font-size: 1.5rem;
                border-right-width: 2px;
            }
        }

        /* --- Animation Keyframes --- */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-cursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: var(--text-color); }
        }
    </style>
</head>
<body>

    <button id="darkModeToggle">🌙</button>

    <div class="typing-container">
        <div class="line-wrapper">
            <p class="line line1">hi. i am krishnan.</p>
        </div>
        <div class="line-wrapper">
            <p class="line line2">thanks for visiting.</p>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('darkModeToggle');
        const body = document.body;

        // 1. Check if the user already chose dark mode in a previous visit
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggleBtn.textContent = '☀️';
        }

        // 2. Listen for clicks on the button
        toggleBtn.addEventListener('click', () => {
            // Toggle the class on the body
            body.classList.toggle('dark-mode');

            // 3. Update the button text and save the preference
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = '🌙';
            }
        });
    </script>

</body>
</html>
